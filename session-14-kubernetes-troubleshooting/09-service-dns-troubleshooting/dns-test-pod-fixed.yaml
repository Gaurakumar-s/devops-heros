# The original dns-test-pod.yaml uses registry.k8s.io/e2e-test-images/dnsutils:1.3, which
# no longer exists in the registry (ImagePullBackOff). busybox has nslookup + wget.
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
spec:
  containers:
    - name: dns-test
      image: busybox:1.36
      command:
        - sleep
        - "3600"
