# FIX: the app exits 1 when DATABASE_URL is missing -> provide the env var.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.12-alpine   # was 3.11-alpine; Docker Hub returned 429 Too Many Requests for that tag on my laptop
      env:
        - name: DATABASE_URL
          value: "postgresql://yatri_admin:secret@postgres-db.production.svc.cluster.local:5432/yatri"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
          time.sleep(3600)
