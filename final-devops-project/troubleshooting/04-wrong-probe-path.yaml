# ISSUE 4 – readiness probe points at a path that returns 404, liveness too aggressive
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
spec:
  replicas: 2
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: taskboard }
  template:
    metadata:
      labels: { app: taskboard }
    spec:
      containers:
        - name: taskboard
          image: ghcr.io/gaurakumar-s/taskboard:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: taskboard-config } }]
          env:
            - { name: ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: taskboard-secret, key: ADMIN_TOKEN } } }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 5
            failureThreshold: 1
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: taskboard-data }
