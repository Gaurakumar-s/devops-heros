# ISSUE 5 – memory limit far below what gunicorn + 2 workers need, CPU request unschedulable
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
spec:
  replicas: 2
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: taskboard }
  template:
    metadata:
      labels: { app: taskboard }
    spec:
      containers:
        - name: taskboard
          image: ghcr.io/gaurakumar-s/taskboard:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: taskboard-config } }]
          env:
            - { name: ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: taskboard-secret, key: ADMIN_TOKEN } } }
          volumeMounts: [{ name: data, mountPath: /data }]
          resources:
            requests: { cpu: "64", memory: 16Mi }
            limits:   { cpu: "64", memory: 16Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: taskboard-data }
