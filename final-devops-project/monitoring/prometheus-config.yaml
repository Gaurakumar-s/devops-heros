apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: taskboard
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      # every Pod in the namespace annotated prometheus.io/scrape=true is scraped on its annotated port/path
      - job_name: taskboard-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [taskboard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alert-rules.yml: |
    groups:
      - name: taskboard
        rules:
          - alert: TaskboardPodDown
            expr: up{job="taskboard-pods"} == 0
            for: 30s
            labels: { severity: critical }
            annotations: { summary: "taskboard pod {{ $labels.pod }} is not being scraped" }
          - alert: TaskboardHighErrorRate
            expr: sum(rate(taskboard_requests_total{status=~"5.."}[2m])) / sum(rate(taskboard_requests_total[2m])) > 0.05
            for: 1m
            labels: { severity: warning }
            annotations: { summary: "more than 5% of taskboard requests are 5xx" }
          - alert: TaskboardSlowRequests
            expr: histogram_quantile(0.95, sum by (le) (rate(taskboard_request_seconds_bucket[2m]))) > 0.5
            for: 1m
            labels: { severity: warning }
            annotations: { summary: "taskboard p95 latency above 500ms" }
