# Argo CD Application: Git (this repo, kubernetes/ folder) is the source of truth for the taskboard namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gaurakumar-s/devops-heros.git
    targetRevision: main
    path: final-devops-project/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
