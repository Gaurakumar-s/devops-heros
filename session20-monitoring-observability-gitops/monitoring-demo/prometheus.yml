global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter          # host CPU / memory / disk
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: demo-app               # application metrics + /health
    static_configs:
      - targets: ["demo-app:8000"]
