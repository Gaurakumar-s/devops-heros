# In-cluster load generator: 6 busybox Pods hammering the Service from inside the cluster.
# (load_generator.sh does the same from the laptop through a kubectl port-forward, which is
#  much slower on macOS, so this version is what actually pushes the HPA on minikube.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 6
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: hammer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://yatri-backend-service/healthz >/dev/null 2>&1; done"]
