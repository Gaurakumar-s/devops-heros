# Session 21 – instructor TaskBoard capstone (session21-python/): test -> build + Trivy scan + push (GHCR) -> deploy (kind + Helm)
name: Session 21 TaskBoard Capstone

on:
  push:
    branches: [main]
    paths: ["session21-python/**", ".github/workflows/session21-taskboard.yml"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: gaurakumar-s

defaults:
  run:
    working-directory: session21-python

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: session21-python/backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -v

  build-scan-push:
    name: Build, Trivy scan, push
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build images
        run: |
          docker build -t $REGISTRY/$OWNER/taskboard-backend:${{ github.sha }} ./backend
          docker build -t $REGISTRY/$OWNER/taskboard-frontend:${{ github.sha }} ./frontend
      - name: Install Trivy
        run: curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz | tar -xz trivy
      - name: Trivy scan backend (fail on HIGH/CRITICAL)
        run: ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $REGISTRY/$OWNER/taskboard-backend:${{ github.sha }}
      - name: Trivy scan frontend (fail on HIGH/CRITICAL)
        run: ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $REGISTRY/$OWNER/taskboard-frontend:${{ github.sha }}
      - name: Push images (SHA tag + latest)
        run: |
          for img in taskboard-backend taskboard-frontend; do
            docker tag $REGISTRY/$OWNER/$img:${{ github.sha }} $REGISTRY/$OWNER/$img:latest
            docker push $REGISTRY/$OWNER/$img:${{ github.sha }}
            docker push $REGISTRY/$OWNER/$img:latest
          done

  deploy:
    name: Deploy with Helm (kind)
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.10.0
      - name: Namespace + registry credentials
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n taskboard create secret docker-registry ghcr-creds --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}
          kubectl -n taskboard patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr-creds"}]}'
      - name: helm upgrade --install
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard \
            --set backend.image=$REGISTRY/$OWNER/taskboard-backend --set backend.tag=${{ github.sha }} \
            --set frontend.image=$REGISTRY/$OWNER/taskboard-frontend --set frontend.tag=${{ github.sha }} \
            --set replicaCount=1 --set hpa.enabled=false --set monitoring.serviceMonitor.enabled=false \
            --wait --timeout 300s
          kubectl -n taskboard get pods,svc,pvc
      - name: Smoke test
        run: |
          kubectl -n taskboard port-forward svc/taskboard-backend 8000:8000 &
          sleep 5
          curl -sf http://localhost:8000/health && echo
          curl -sf -X POST http://localhost:8000/api/tasks -H 'Content-Type: application/json' -d '{"title":"deployed by pipeline","priority":"HIGH","assignee":"CI"}' && echo
          curl -sf http://localhost:8000/api/tasks && echo
          curl -sf http://localhost:8000/metrics | grep http_requests_total | head -3
